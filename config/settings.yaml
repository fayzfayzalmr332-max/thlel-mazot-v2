# =============================================================
# THLEL MAZOT — إعدادات اللوحة التحليلية لأسواق الطاقة وتأثيرها على سوريا
# كل القيم قابلة للتعديل؛ تُقرأ عند كل تشغيل.
# =============================================================

app:
  title: "ثُلَّ المازوت — لوحة أسواق الطاقة وتأثيراتها المحلية على سوريا"
  subtitle: "متابعة أسواق الغازويل/المازوت الآجلة وعملية التسعير المحلية والإطار الجيوسياسي"
  refresh_seconds: 60
  cache_dir: ".cache"
  mem_cache_seconds: 300
  timezone: "Asia/Damascus"

market:
  history:
    period: "1y"
    interval: "1d"
    days: 252
    intraday_interval: "5m"
    intraday_days: 3
  tickers:
    gasoil:
      candidates: ["HO=F", "GCL=F", "GZ=F"]   # GCL=F حُذف من Yahoo — HO=F أولًا
      display: "ICEEUR:ULS1!"
      label: "Gasoil Futures (London Gas Oil)"
      label_ar: "الغازويل الآجل (لندن)"
      unit: "USD/t"
      unit_ar: "دولار/طن"
      unit_factors:
        "HO=F": 312.0          # تحويل من دولار/غالون إلى دولار/طن
        "GZ=F": 1.0
      conversion_notes:
        "HO=F": "مقوّم من زيت التدفئة الأمريكي (NYMEX) دولار/غالون → دولار/طن"
      synthetic_base: 1503.0   # مستوى حي مبني على HO=F≈4.82$/غالون (أيلول 2026)
      synthetic_vol: 0.24
      synthetic_drift: 0.03
    brent:
      candidates: ["BZ=F", "CL=F"]
      display: "ICEEUR:BC1!"
      label: "Brent Crude (ICE)"
      label_ar: "خام برنت"
      unit: "USD/bbl"
      unit_ar: "دولار/برميل"
      synthetic_base: 106.9
      synthetic_vol: 0.21
      synthetic_drift: 0.02
    shipping:
      candidates: ["BDRY", "SEA", "^BDI"]     # ^BDI حُذف — بدائل ETF حية
      display: "Baltic Dry Index"
      label: "Baltic Dry Index (freight proxy)"
      label_ar: "مؤشر البلطيق (الشحن)"
      unit: "pts"
      unit_ar: "نقطة"
      synthetic_base: 16.0     # BDRY ETF ≈ 15-20 دولارًا (وليس آلاف النقاط)
      synthetic_vol: 0.28
      synthetic_drift: 0.00
    us_heating:
      candidates: ["HO=F"]
      display: "NYMEX:HO!"
      label: "NY Harbor ULSD (proxy)"
      label_ar: "زيت التدفئة الأمريكي (مرجع)"
      unit: "USD/gal"
      unit_ar: "دولار/غالون"
      synthetic_base: 4.82
      synthetic_vol: 0.22
      synthetic_drift: 0.02

fx:
  candidates: ["SYP=X", "USD=SYP"]
  # الليرة السورية الجديدة (بعد حذف صفرين) — القديمة = الجديدة × 100
  syp_unit: "new"
  old_factor: 100.0
  official_usd_syp: 121.66       # ~12,166 قديمة (er-api، رسمي)
  parallel_usd_syp: 134.0        # ~13,400 قديمة (سوق SP-Today 133.75-134.25)
  parallel_spread: 0.10
  note_ar: "الوحدة: ليرة جديدة/دولار (القديمة ×100). مصادر حية: er-api للرسمي + SP-Today للسوق — عدّل يدويًا عند الحاجة"

pricing:
  litres_per_tonne: 1190.0
  gallons_per_tonne: 312.0
  insurance_rate: 0.008          # (% من قيمة الشحنة)
  freight_base_usd_t: 18.0        # شحن أساسي دولار/طن
  freight_bdi_sensitivity: 0.012  # دولار/طن لكل نقطة انحراف عن المرجع
  refining_margin_usd_t: 55.0     # هامش تكرير/قيمة مضافة محلية
  distribution_margin_syp_l: 9.5  # ليرة جديدة/لتر (كانت 950 قديمة)
  vat_rate: 0.10
  sanction_premium_usd_t: 120.0   # علاوة عقوبات/التأمين القسري
  official_baseline:
    decree_date: "2026-09-13"     # الرفع غير المسبوق (Enab Baladi 13 أيلول)
    decree_label_ar: "تسعيرة أيلول 2026 بعد الرفع غير المسبوق — المازوت 175 ل.س جديدة/لتر (17,500 قديمة)"
    rationed_mazot_syp_l: 175.0      # السعر الرسمي الجديد (ليرة جديدة/لتر)
    full_price_mazot_syp_l: 195.0    # تقدير السوق الموازي بعد الرفع — قابل للتعديل
    gasoline_95_syp_l: 195.0         # بنزين 95: 195 جديدة (19,500 قديمة)
    gasoline_92_syp_l: 185.0         # بنزين 92: 185 جديدة (18,500 قديمة)
    unit: "ل.س جديدة/لتر"

momentum:
  short_window: 5
  long_window: 30
  spike_5d_pct: 6.0        # ارتفاع 5 أيام تراكمي يُعد "صاروخًا"
  purging_5d_pct: -6.0
  drift_long_pct: 4.0      # انخفاض تراكمي 30 يومًا
  feather_min_down_days: 12
  feather_max_daily_decline: 0.35  # % يوميًا — انحدار بطيء
  asymmetry_threshold: 1.8

sentiment:
  weights:
    geopolitical: 0.35
    momentum: 0.30
    parity_gap: 0.20
    shipping: 0.15
  grade_bands:
    - max_score: 35
      grade: "GREEN"
      label_ar: "ارتياح / تبريد دولي"
    - max_score: 65
      grade: "YELLOW"
      label_ar: "متابعة حذرة"
    - max_score: 100
      grade: "RED"
      label_ar: "استمرار أزمة الإمداد / ضغط مضاعف"

news:
  max_items_per_feed: 6
  request_timeout: 12
  half_life_hours: 36
  seen_cache_max_hours: 48
  google_news_hl: "en-US"
  google_news_gl: "US"
  google_queries:
    - "Syria fuel OR mazot diesel price decree"
    - "Syria fuel price hike protest"
    - "Syria currency redenomination new Syrian pound"
    - "heating oil OR gasoil OR ULSD market rally"
    - "Baniyas refinery operations"
    - "Homs refinery Syria"
    - "Strait of Hormuz shipping tanker disruption"
    - "الكهرباء والمازوت سوريا نقص"
    - "سعر المازوت والغاز سوريا"
    - "رفع أسعار المحروقات سوريا احتجاجات"
    - "الليرة السورية الجديدة حذف الأصفار"
    - "مصفاة بانياس سوريا"
    - "مصفاة حمص سوريا"
    - "مضيق هرمز ناقلات النفط"
    - "عقوبات الطاقة على سوريا"
  static_feeds:
    - label: "OilPrice Energy"
      url: "https://oilprice.com/rss/main"
    - label: "Enab Baladi (EN)"
      url: "https://english.enabbaladi.net/feed/"
  ar_queries:
    - "سعر المازوت سوريا"
    - "مصفاة بانياس"
    - "مضيق هرمز ناقلات النفط"
    - "رفع أسعار المحروقات سوريا"
    - "الليرة السورية الجديدة"
    - "احتجاجات المحروقات سوريا"

alerting:
  telegram:
    enabled: true             # يَفعَل فقط عند وجود اعتماديات حقيقية (secrets.toml / بيئة)
    bot_token: "PLACEHOLDER_BOT_TOKEN"      # من @BotFather — لا يوضع هنا، بل في .streamlit/secrets.toml
    chat_id: "PLACEHOLDER_CHAT_ID"          # لا يوضع هنا، بل في .streamlit/secrets.toml
    parse_mode: "HTML"
    send_api_base: "https://api.telegram.org/bot{token}/sendMessage"
  price_move_threshold_usd_t: 30.0          # عتبة حركة الغازويل (دولار/طن) لإرسال تنبيه
  min_news_severity: 0.65                   # لا تُنبّه لأخبار دون هذه الشدة (0-1)
  critical_keywords:
    - "بانياس"
    - "مصفاة بانياس"
    - "مصفاة حمص"
    - "مضيق هرمز"
    - "قرار رفع"
    - "رفع أسعار المحروقات"
    - "إيقاف"
    - "نقص المازوت"
    - "احتجاجات المحروقات"
    - "الليرة الجديدة"
    - "mazot decree"
    - "refinery maintenance"
    - "fuel price protest"
    - "redenomination"
  state_cache_key: "alerts_state"

reporting:
  pdf:
    author: "THLEL MAZOT"
    page_size: "A4"
    include_geo_triggers: true
    lang: "ar"